<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620" fill="none">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #8e8e93; font-size: 13px; }
      .dim { fill: #636366; font-size: 12px; }
      .val { fill: #8e8e93; font-size: 12px; text-anchor: end; }
      .pct { fill: #f4f4f5; font-size: 12px; text-anchor: end; }
      .dotted { stroke: #52525b; stroke-width: 1; stroke-dasharray: 2 2; }
    </style>
  </defs>

  <!-- Outer Dark Background -->
  <rect width="420" height="620" rx="16" fill="#121212"/>

  <!-- Card Container -->
  <rect x="14" y="14" width="392" height="592" rx="12" fill="#161616" stroke="#262626" stroke-width="1"/>

  <!-- Header: Context + ID + Pill -->
  <text x="32" y="42" class="sans" fill="#8e8e93" font-size="14" font-weight="500">Context</text>
  <text x="90" y="42" class="mono" fill="#636366" font-size="12">#a18bcc4a</text>

  <rect x="316" y="27" width="72" height="22" rx="5" fill="#10b981" fill-opacity="0.15"/>
  <text x="352" y="42" class="sans" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">HEALTHY</text>

  <!-- Active Conversation Subtitle -->
  <text x="32" y="61" class="sans dim">AI Session Context and Memory Management</text>

  <!-- Percentage Used & Total Capacity -->
  <text x="32" y="92" class="sans" fill="#f4f4f5" font-size="16" font-weight="600">4.4% used</text>
  <text x="388" y="92" class="mono" fill="#8e8e93" font-size="13" text-anchor="end">44.2k / 1M</text>

  <!-- Multi-Segment Stacked Progress Bar -->
  <rect x="32" y="104" width="356" height="6" rx="3" fill="#27272a"/>
  <rect x="32" y="104" width="44" height="6" rx="3" fill="#2b7fff"/>
  <rect x="78" y="104" width="22" height="6" rx="3" fill="#ea580c"/>
  <rect x="102" y="104" width="10" height="6" rx="3" fill="#10b981"/>
  <rect x="114" y="104" width="8" height="6" rx="3" fill="#d97706"/>
  <rect x="124" y="104" width="8" height="6" rx="3" fill="#71717a"/>
  <rect x="134" y="104" width="18" height="6" rx="3" fill="#52525b"/>

  <!-- Token Category Breakdown List -->
  <!-- Row 1: Messages (KV cached) -->
  <rect x="32" y="128" width="11" height="11" rx="3" fill="#2b7fff"/>
  <text x="53" y="138" class="sans muted">Messages (KV cached)</text>
  <text x="330" y="138" class="mono val">26.9k</text>
  <text x="388" y="138" class="mono pct">2.7%</text>

  <!-- Row 2: Uncached input -->
  <rect x="32" y="154" width="11" height="11" rx="3" fill="#ea580c"/>
  <text x="53" y="164" class="sans muted">Uncached input</text>
  <line x1="53" y1="168" x2="145" y2="168" class="dotted"/>
  <text x="330" y="164" class="mono val">17.3k</text>
  <text x="388" y="164" class="mono pct">1.7%</text>

  <!-- Row 3: System prompt -->
  <rect x="32" y="180" width="11" height="11" rx="3" fill="#10b981"/>
  <text x="53" y="190" class="sans muted">System prompt</text>
  <text x="330" y="190" class="mono val">3.5k</text>
  <text x="388" y="190" class="mono pct">0.4%</text>

  <!-- Row 4: Skills -->
  <rect x="32" y="206" width="11" height="11" rx="3" fill="#d97706"/>
  <text x="53" y="216" class="sans muted">Skills</text>
  <line x1="53" y1="220" x2="86" y2="220" class="dotted"/>
  <text x="330" y="216" class="mono val">2.6k</text>
  <text x="388" y="216" class="mono pct">0.3%</text>

  <!-- Row 5: MCP tools & instructions -->
  <rect x="32" y="232" width="11" height="11" rx="3" fill="#71717a"/>
  <text x="53" y="242" class="sans muted">MCP tools &amp; instructions</text>
  <line x1="53" y1="246" x2="205" y2="246" class="dotted"/>
  <text x="330" y="242" class="mono val">2.2k</text>
  <text x="388" y="242" class="mono pct">0.2%</text>

  <!-- Row 6: Memory & rules files -->
  <rect x="32" y="258" width="11" height="11" rx="3" fill="#71717a"/>
  <text x="53" y="268" class="sans muted">Memory &amp; rules files</text>
  <line x1="53" y1="272" x2="178" y2="272" class="dotted"/>
  <text x="330" y="268" class="mono val">0.9k</text>
  <text x="388" y="268" class="mono pct">0.1%</text>

  <!-- Row 7: Autocompact buffer -->
  <rect x="32" y="284" width="11" height="11" rx="3" fill="#52525b"/>
  <text x="53" y="294" class="sans muted">Autocompact buffer</text>
  <text x="330" y="294" class="mono val">33k</text>
  <text x="388" y="294" class="mono pct">3.3%</text>

  <!-- Row 8: Free space -->
  <rect x="32" y="310" width="11" height="11" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="53" y="320" class="sans muted">Free space</text>
  <text x="330" y="320" class="mono val">922.8k</text>
  <text x="388" y="320" class="mono pct">92.3%</text>

  <!-- Divider 1 -->
  <line x1="32" y1="338" x2="388" y2="338" stroke="#262626" stroke-width="1"/>

  <!-- Listed Session Telemetry Rows (No Cards) -->
  <!-- KV Cache state -->
  <rect x="32" y="354" width="11" height="11" rx="3" fill="#10b981"/>
  <text x="53" y="364" class="sans muted">KV Cache state</text>
  <text x="322" y="364" class="mono val">60.8% hit</text>
  <text x="388" y="364" class="mono" fill="#34d399" font-size="12" text-anchor="end">Warm</text>

  <!-- Compactions -->
  <rect x="32" y="380" width="11" height="11" rx="3" fill="#71717a"/>
  <text x="53" y="390" class="sans muted">Compactions</text>
  <text x="322" y="390" class="mono val">1 / 2</text>
  <text x="388" y="390" class="mono dim" text-anchor="end">Ready</text>

  <!-- Idle time -->
  <rect x="32" y="406" width="11" height="11" rx="3" fill="#71717a"/>
  <text x="53" y="416" class="sans muted">Idle time</text>
  <text x="322" y="416" class="mono val">0.3m</text>
  <text x="388" y="416" class="mono dim" text-anchor="end">&lt; 15m</text>

  <!-- Steps -->
  <rect x="32" y="432" width="11" height="11" rx="3" fill="#71717a"/>
  <text x="53" y="442" class="sans muted">Steps</text>
  <text x="322" y="442" class="mono val">168</text>
  <text x="388" y="442" class="mono dim" text-anchor="end">7 active</text>

  <!-- Divider 2 -->
  <line x1="32" y1="460" x2="388" y2="460" stroke="#262626" stroke-width="1"/>

  <!-- Action Buttons: Compact (disabled <80k) & Offload -->
  <rect x="32" y="474" width="173" height="34" rx="8" fill="#1f1f22" stroke="#3f3f46" stroke-width="1" opacity="0.45"/>
  <text x="93" y="495" class="sans" fill="#f4f4f5" font-size="12" font-weight="500" opacity="0.5" text-anchor="middle">Compact</text>
  <rect x="126" y="482" width="44" height="18" rx="4" fill="#27272a" opacity="0.5"/>
  <text x="148" y="495" class="mono" fill="#8e8e93" font-size="10" opacity="0.5" text-anchor="middle">&lt;80k</text>

  <rect x="215" y="474" width="173" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="301" y="495" class="sans" fill="#93c5fd" font-size="12" font-weight="500" text-anchor="middle">Offload to New Chat  ↗</text>

  <!-- Divider 3 -->
  <line x1="32" y1="522" x2="388" y2="522" stroke="#262626" stroke-width="1"/>

  <!-- Expandable Detail Rows -->
  <text x="32" y="544" class="sans dim">›</text>
  <text x="46" y="544" class="sans muted">Offload prompt summary</text>
  <text x="388" y="544" class="mono dim" text-anchor="end">11 turns</text>

  <text x="32" y="568" class="sans dim">›</text>
  <text x="46" y="568" class="sans muted">Files created / modified</text>
  <text x="388" y="568" class="mono dim" text-anchor="end">15</text>

  <text x="32" y="592" class="sans dim">›</text>
  <text x="46" y="592" class="sans muted">Active skills &amp; rules</text>
  <text x="388" y="592" class="mono dim" text-anchor="end">41</text>
</svg>
